<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#000000">
    <title>VOID STRIKER</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overscroll-behavior: none;
        }
        body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            cursor: none;
        }
        #game-canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
        }
        #hud-canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #0df;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        #loading.hidden { display: none; }
        #loading.error { color: #f44; }
    </style>
    <!-- Polyfill import maps for older iOS Safari (<16.4) -->
    <script async src="https://ga.jspm.io/npm:[email protected]/dist/es-module-shims.js"></script>
</head>
<body>
    <div id="loading">VOID STRIKER<br><span style="font-size:14px;opacity:0.7">LOADING...</span></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import('./js/main.js').catch(err => {
            console.error(err);
            const el = document.getElementById('loading');
            if (el) {
                el.classList.add('error');
                el.innerHTML = 'FAILED TO LOAD<br><span style="font-size:12px">' + (err.message || err) + '</span>';
            }
        });
    </script>
</body>
</html>
